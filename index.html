<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Practitioner CLF-C02</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Aplica el tema guardado antes de pintar la página para evitar flash -->
  <script>
  (function(){
    var raw = localStorage.getItem("clf-theme");
    var t; try { t = JSON.parse(raw); } catch(e) { t = raw; }
    if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
  </script>
</head>
<body>
<!-- Los textos viven en js/lang/es.js / js/lang/en.js: data-i18n = clave del texto, data-i18n-attr = "atributo:clave" -->

<header class="top"><div class="wrap">
  <div class="toprow">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <div class="tools">
      <div class="langsw" id="langSw" role="group" data-i18n-attr="aria-label:langGroupAria"></div>
      <button class="theme-btn" id="themeBtn" type="button" data-i18n-attr="aria-label:themeAria;title:themeTitle"><span class="ti" aria-hidden="true">☾</span><span class="tl"></span></button>
    </div>
  </div>
  <h1>Cloud Practitioner</h1>
  <div class="meta">
    <span class="chip hot" id="countdown"></span>
    <span class="chip" data-i18n="chipQuestions"></span>
    <span class="chip" data-i18n="chipPass"></span>
  </div>
</div></header>

<nav class="tabs" data-i18n-attr="aria-label:tabsAria"><div class="wrap" role="tablist">
  <button role="tab" id="tab-plan" aria-controls="plan" aria-selected="true" data-i18n="tabPlan"></button>
  <button role="tab" id="tab-kit" aria-controls="kit" aria-selected="false" data-i18n="tabKit"></button>
  <button role="tab" id="tab-practica" aria-controls="practica" aria-selected="false" data-i18n="tabPractice"></button>
</div></nav>

<main>
<!-- ================= PLAN ================= -->
<div class="wrap" id="plan" role="tabpanel" aria-labelledby="tab-plan">
  <section>
    <h2 data-i18n="setupH"></h2>
    <div class="card setup">
      <div class="fld">
        <label for="examDate" data-i18n="examDateLbl"></label>
        <input type="date" id="examDate">
        <label class="chk"><input type="checkbox" id="noDate"><span data-i18n="noDateLbl"></span></label>
      </div>
      <div class="fld">
        <span id="blockedLbl" data-i18n="blockedLbl"></span>
        <div class="daybtns" id="blockedDays" role="group" aria-labelledby="blockedLbl">
          <button type="button" class="dbtn" data-d="1" aria-pressed="false"></button>
          <button type="button" class="dbtn" data-d="2" aria-pressed="false"></button>
          <button type="button" class="dbtn" data-d="3" aria-pressed="false"></button>
          <button type="button" class="dbtn" data-d="4" aria-pressed="false"></button>
          <button type="button" class="dbtn" data-d="5" aria-pressed="false"></button>
          <button type="button" class="dbtn" data-d="6" aria-pressed="false"></button>
          <button type="button" class="dbtn" data-d="0" aria-pressed="false"></button>
        </div>
      </div>
      <div class="fld">
        <label for="minWeek" data-i18n="minWeekLbl"></label>
        <select id="minWeek"></select>
      </div>
      <div class="fld">
        <label for="minWeekend" data-i18n="minWeekendLbl"></label>
        <select id="minWeekend"></select>
      </div>
      <p class="setupnote" id="planSummary"></p>
    </div>
  </section>

  <section>
    <div class="card progress">
      <div class="ptext"><span data-i18n="progressTitle"></span><span id="ptotal">0 / 0</span></div>
      <div class="bar"><i id="pbar"></i></div>
      <p class="lead" style="font-size:14px" data-i18n="progressHelp"></p>
    </div>
  </section>

  <section>
    <h2 data-i18n="blocksH"></h2>
    <p class="lead" id="blocksLead"></p>
    <div class="note" id="planLate" hidden><span id="lateTxt"></span> <button type="button" class="btn ghost" id="recalc" data-i18n="recalc"></button></div>
    <div class="plannote" id="planWarn" hidden></div>
    <div id="blocks" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>

  <section>
    <h2 data-i18n="weekH"></h2>
    <p class="lead" id="weekLead"></p>
    <div class="tablewrap"><table>
      <thead><tr><th data-i18n="thDay"></th><th data-i18n="thTime"></th><th data-i18n="thDo"></th></tr></thead>
      <tbody id="weekRows"></tbody>
    </table></div>
    <p class="lead" style="font-size:15px" data-i18n="weekRule"></p>
  </section>

  <section>
    <h2 data-i18n="domH"></h2>
    <div class="tablewrap"><table>
      <thead><tr><th data-i18n="thDomain"></th><th data-i18n="thWeight"></th><th data-i18n="thQuestions"></th></tr></thead>
      <tbody data-i18n="domRows"></tbody>
    </table></div>
    <p class="lead" style="font-size:15px" data-i18n="domNote"></p>
  </section>

  <section>
    <h2 data-i18n="resH"></h2>
    <div class="tablewrap"><table>
      <thead><tr><th data-i18n="thResource"></th><th data-i18n="thFor"></th><th data-i18n="thCost"></th></tr></thead>
      <tbody data-i18n="resRows"></tbody>
    </table></div>
    <p data-i18n="resOfficial"></p>
  </section>
</div>

<!-- ================= KIT ================= -->
<div class="wrap" id="kit" role="tabpanel" aria-labelledby="tab-kit" hidden>
  <section>
    <h2 data-i18n="kitLangH"></h2>
    <ul class="plain" data-i18n="kitLangList"></ul>
  </section>

  <section>
    <h2 data-i18n="searchH"></h2>
    <p class="lead" data-i18n="searchLead"></p>
    <input class="search" id="svcSearch" type="search" data-i18n-attr="placeholder:searchPh;aria-label:searchAria">
    <div class="tablewrap qa" id="svcList"></div>
  </section>

  <section>
    <h2 data-i18n="pairsH"></h2>
    <div class="tablewrap"><table>
      <thead><tr><th data-i18n="thPair"></th><th data-i18n="thDiff"></th></tr></thead>
      <tbody id="pairs"></tbody>
    </table></div>
  </section>

  <section>
    <h2 data-i18n="supportH"></h2>
    <p class="note" data-i18n="supportNote"></p>
    <div class="tablewrap"><table>
      <thead><tr><th data-i18n="thPlan"></th><th data-i18n="thFastest"></th><th data-i18n="thDistinct"></th></tr></thead>
      <tbody data-i18n="supportRows"></tbody>
    </table></div>
    <p class="lead" style="font-size:15px" data-i18n="supportHint"></p>
  </section>

  <section>
    <h2 data-i18n="listsH"></h2>
    <div class="card" style="display:flex;flex-direction:column;gap:12px" data-i18n="listsCard"></div>
  </section>

  <section>
    <h2 data-i18n="figuresH"></h2>
    <div class="tablewrap"><table><tbody data-i18n="figuresRows"></tbody></table></div>
  </section>

  <section>
    <h2 data-i18n="glossH"></h2>
    <div class="tablewrap"><table>
      <thead><tr><th data-i18n="glossTh1"></th><th data-i18n="glossTh2"></th><th data-i18n="glossTh3"></th></tr></thead>
      <tbody id="gloss"></tbody>
    </table></div>
  </section>

  <section>
    <h2 data-i18n="examdayH"></h2>
    <ul class="plain" data-i18n="examdayList"></ul>
  </section>
</div>

<!-- ================= PRÁCTICA ================= -->
<div class="wrap" id="practica" role="tabpanel" aria-labelledby="tab-practica" hidden>
  <section>
    <h2 data-i18n="practiceH"></h2>
    <p class="lead" data-i18n="practiceLead"></p>
    <div class="card quiz" id="quiz"></div>
  </section>
</div>
</main>

<div class="wrap"><footer style="padding-block:0 32px" data-i18n="footer"></footer></div>

<script src="js/lang/es.js"></script>
<script src="js/lang/en.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/planner.js"></script>
<script src="js/app.js"></script>
</body>
</html>
